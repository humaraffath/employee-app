spring.application.name=employeeapp

# Database connection (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/smart_employee_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (development settings)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:8f3a1c9d2e6b4a7f0c5d8e1b3a6f9c2d5e8b1a4f7c0d3e6b9a2f5c8d1e4b7a0f}
app.jwt.expiration-ms=3600000


